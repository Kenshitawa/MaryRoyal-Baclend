<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#102653">
  <link rel="canonical" href="https://maryroyalschool.co.ke/404.html">
  <title>Page not found | Mary Royal School</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/images/favicon-48.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .error-page { min-height: 100svh; display: grid; place-items: center; padding: 28px; background: linear-gradient(145deg,#102653,#16418b 55%,#1d4ed8); color: #fff; text-align: center; }
    .error-card { width: min(100%,620px); padding: clamp(30px,7vw,64px); border: 1px solid rgba(255,255,255,.2); border-radius: 28px; background: rgba(255,255,255,.1); box-shadow: 0 24px 70px rgba(5,17,41,.24); backdrop-filter: blur(14px); }
    .error-code { margin: 0; color: #bfdbfe; font-size: clamp(4rem,18vw,8rem); font-weight: 800; letter-spacing: -.08em; line-height: 1; }
    .error-card h1 { margin: 20px 0 10px; font-size: clamp(1.7rem,6vw,2.5rem); }
    .error-card p { margin: 0 auto 26px; max-width: 430px; color: #dbeafe; }
    .error-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .error-actions a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border: 1px solid rgba(255,255,255,.45); border-radius: 14px; color: #fff; font-weight: 800; }
    .error-actions a:first-child { border-color: #fff; background: #fff; color: #16418b; }
    .error-actions a:focus-visible { outline: 3px solid #bfdbfe; outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card" aria-labelledby="error-title">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 id="error-title">We couldn’t find that page</h1>
      <p>The page may have moved, or the address may be incorrect. Return to the Mary Royal School website or open the school portal.</p>
      <div class="error-actions">
        <a href="/">Go to school website</a>
        <a href="https://portal.maryroyalschool.co.ke/">Open school portal</a>
      </div>
    </section>
  </main>
</body>
</html>
